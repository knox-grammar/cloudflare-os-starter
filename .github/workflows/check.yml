name: Check and staging

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The root postinstall (`cf-os install`) installs the submodule's own workspace too.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and type-check
        run: pnpm lint
      # No Cloudflare credentials here: cf-os skips the account checks and dry-runs every deploy.
      - name: Check production deployment (dry-run only)
        run: pnpm cf-os check
      - name: Check staging deployment (dry-run only)
        run: pnpm cf-os check --config deployment.staging.jsonc

  staging-preflight:
    needs: check
    if: github.repository == 'knox-grammar/cloudflare-os-starter' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require existing reviewer-protected staging environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/knox-grammar/cloudflare-os-starter/environments/staging > "$RUNNER_TEMP/staging-environment.json"
          jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' "$RUNNER_TEMP/staging-environment.json"
          jq -e '.deployment_branch_policy.custom_branch_policies == true' "$RUNNER_TEMP/staging-environment.json"
          gh api repos/knox-grammar/cloudflare-os-starter/environments/staging/deployment-branch-policies |
            jq -e '.branch_policies | length == 1 and .[0].name == "main" and .[0].type == "branch"'

  deploy:
    needs: staging-preflight
    concurrency:
      group: knox-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
      url: https://os-staging.knoxi.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Match approved SHA again
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: test "$APPROVED_SHA" = "$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      # cf-os verifies the account, Access application and pinned storage, builds everything, then
      # deploys every Gatekeeper, then the Workshop, then the Router last.
      - name: Deploy staging (Router last)
        env:
          CLOUDFLARE_ACCOUNT_ID: 2ddaede0fbdd479a6bf410a5f1eb76ad
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing staging environment STAGING_CLOUDFLARE_API_TOKEN'; exit 1; }
          pnpm cf-os deploy --config deployment.staging.jsonc
