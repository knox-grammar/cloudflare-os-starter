name: Check and staging

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install both workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cloudflare-os install --frozen-lockfile
      - name: Prepare exact-pin WorkIQ extension and check types
        run: |
          node scripts/prepare-workiq.ts
          pnpm run types:scripts
          pnpm --filter @knox/gatekeeper-workiq run types:check
      - name: Check production deployment (dry-run only)
        run: pnpm check
      - name: Check staging deployment (dry-run only)
        run: pnpm check:staging
      - name: Check private staging bootstrap (dry-run only)
        run: pnpm check:staging:bootstrap

  staging-preflight:
    needs: check
    if: github.repository == 'knox-grammar/cloudflare-os-starter' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require existing reviewer-protected staging environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/knox-grammar/cloudflare-os-starter/environments/staging > "$RUNNER_TEMP/staging-environment.json"
          jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' "$RUNNER_TEMP/staging-environment.json"
          jq -e '.deployment_branch_policy.custom_branch_policies == true' "$RUNNER_TEMP/staging-environment.json"
          gh api repos/knox-grammar/cloudflare-os-starter/environments/staging/deployment-branch-policies |
            jq -e '.branch_policies | length == 1 and .[0].name == "main" and .[0].type == "branch"'

  deploy:
    needs: staging-preflight
    concurrency:
      group: knox-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
      url: https://os-staging.knoxi.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true
          persist-credentials: false
      - name: Match approved SHA again
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: |
          test "$APPROVED_SHA" = "$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install both workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cloudflare-os install --frozen-lockfile
      - name: Prepare exact-pin WorkIQ extension
        run: node scripts/prepare-workiq.ts
      - name: Deploy approved existing staging stack (Router last)
        env:
          CLOUDFLARE_ACCOUNT_ID: 2ddaede0fbdd479a6bf410a5f1eb76ad
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing staging environment STAGING_CLOUDFLARE_API_TOKEN'; exit 1; }
          node scripts/staging-workflow.ts deploy
      - name: Record versions and anonymous Access probes
        if: always() && !cancelled()
        env:
          CLOUDFLARE_ACCOUNT_ID: 2ddaede0fbdd479a6bf410a5f1eb76ad
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: node scripts/staging-workflow.ts evidence
      - name: Preserve staging evidence even after partial failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.sha }}-${{ github.run_id }}
          path: staging-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Manual verification reminder
        if: always() && !cancelled()
        run: |
          echo 'Signed-in allowed/denied users, sole /admin access, Microsoft/WorkIQ hosted OAuth, tiny decoded WorkIQ bytes, separately approved action effects, persistence and low-cost AI still require manual evidence. Secret-name presence and anonymous Access redirects do not prove connector readiness. A successful deploy is not production or migration approval.' >> "$GITHUB_STEP_SUMMARY"
