name: Deploy production

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main-branch commit SHA approved for this production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: knox-production
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'knox-grammar/cloudflare-os-starter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - name: Match the approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: test "$APPROVED_SHA" = "$(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install both workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cloudflare-os install --frozen-lockfile
      - name: Validate and dry-run all Workers
        run: pnpm check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://os.knoxi.dev
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          cache: true
          cache_dependency_path: |
            pnpm-lock.yaml
            cloudflare-os/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install both workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cloudflare-os install --frozen-lockfile
      - name: Deploy in wrapper order (Router last)
        env:
          CLOUDFLARE_ACCOUNT_ID: 2ddaede0fbdd479a6bf410a5f1eb76ad
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production environment CLOUDFLARE_API_TOKEN'; exit 1; }
          node scripts/production-preflight.ts
          pnpm deploy
      - name: Retain sanitized pre-upload production inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-preflight.json
          if-no-files-found: warn
          retention-days: 14
